<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Peso de Materiais</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#003366;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#003366;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0055aa;
}

.secao{
    display:none;
    margin-top:15px;
}

.resultado{
    margin-top:20px;
    padding:15px;
    background:#eef4ff;
    border-radius:8px;
    display:none;
}

.resultado p{
    margin:8px 0;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>Calculadora de Pesos</h1>

<label>Tipo de Material</label>
<select id="tipo">
    <option value="bobina">Bobina</option>
    <option value="chapa">Chapa</option>
    <option value="ferro">Ferro Chato</option>
</select>

<label>Material</label>
<select id="material">
    <option value="7.85">Aço Carbono (7,85 g/cm³)</option>
    <option value="7.90">Inox 309 (7,90 g/cm³)</option>
    <option value="7.70">Inox 409 (7,70 g/cm³)</option>
    <option value="7.72">Inox 441 (7,72 g/cm³)</option>
</select>

<!-- BOBINA -->
<div id="bobina" class="secao">

    <label>Diâmetro Externo (mm)</label>
    <input type="number" id="de">

    <label>Diâmetro Interno (mm)</label>
    <input type="number" id="di">

    <label>Largura (mm)</label>
    <input type="number" id="larguraBobina">

    <label>Espessura (mm)</label>
    <input type="number" id="espBobina" step="0.01">

</div>

<!-- CHAPA -->
<div id="chapa" class="secao">

    <label>Comprimento (mm)</label>
    <input type="number" id="compChapa">

    <label>Largura (mm)</label>
    <input type="number" id="largChapa">

    <label>Espessura (mm)</label>
    <input type="number" id="espChapa" step="0.01">

</div>

<!-- FERRO CHATO -->
<div id="ferro" class="secao">

    <label>Largura (mm)</label>
    <input type="number" id="largFerro">

    <label>Espessura (mm)</label>
    <input type="number" id="espFerro" step="0.01">

    <label>Comprimento (m)</label>
    <input type="number" id="compFerro" step="0.01">

</div>

<button onclick="calcular()">Calcular</button>

<div class="resultado" id="resultado">
    <p><strong>Peso:</strong> <span id="peso"></span></p>
    <p><strong>Toneladas:</strong> <span id="ton"></span></p>
    <p id="linhaComprimento" style="display:none;">
        <strong>Comprimento Estimado:</strong>
        <span id="comprimento"></span>
    </p>
</div>

</div>

<script>

const tipo = document.getElementById("tipo");

tipo.addEventListener("change", mostrarCampos);

function mostrarCampos(){

    document.getElementById("bobina").style.display = "none";
    document.getElementById("chapa").style.display = "none";
    document.getElementById("ferro").style.display = "none";

    const valor = document.getElementById("tipo").value;

    document.getElementById(valor).style.display = "block";
}

window.onload = function(){
    mostrarCampos();
};

function calcular(){

    const tipo = document.getElementById("tipo").value;
    const densidade = parseFloat(document.getElementById("material").value);

    let peso = 0;

    if(tipo === "bobina"){

        const de = parseFloat(document.getElementById("de").value);
        const di = parseFloat(document.getElementById("di").value);
        const largura = parseFloat(document.getElementById("larguraBobina").value);
        const esp = parseFloat(document.getElementById("espBobina").value);

        if(isNaN(de) || isNaN(di) || isNaN(largura) || isNaN(esp)){
            alert("Preencha todos os campos.");
            return;
        }

        const volume =
            (Math.PI / 4) *
            ((de * de) - (di * di)) *
            largura;

        peso = volume * (densidade / 1000000);

        const comprimento =
            ((Math.PI / 4) *
            ((de * de) - (di * di)))
            / esp / 1000;

        document.getElementById("linhaComprimento").style.display = "block";

        document.getElementById("comprimento").innerHTML =
            comprimento.toLocaleString('pt-BR',{
                maximumFractionDigits:0
            }) + " m";

    }

    if(tipo === "chapa"){

        const comp = parseFloat(document.getElementById("compChapa").value);
        const larg = parseFloat(document.getElementById("largChapa").value);
        const esp = parseFloat(document.getElementById("espChapa").value);

        if(isNaN(comp) || isNaN(larg) || isNaN(esp)){
            alert("Preencha todos os campos.");
            return;
        }

        peso = (comp * larg * esp * densidade) / 1000000;

        document.getElementById("linhaComprimento").style.display = "none";
    }

    if(tipo === "ferro"){

        const larg = parseFloat(document.getElementById("largFerro").value);
        const esp = parseFloat(document.getElementById("espFerro").value);
        const comp = parseFloat(document.getElementById("compFerro").value);

        if(isNaN(larg) || isNaN(esp) || isNaN(comp)){
            alert("Preencha todos os campos.");
            return;
        }

        peso = larg * esp * comp * densidade * 0.001;

        document.getElementById("linhaComprimento").style.display = "none";
    }

    document.getElementById("peso").innerHTML =
        peso.toLocaleString('pt-BR',{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }) + " kg";

    document.getElementById("ton").innerHTML =
        (peso / 1000).toLocaleString('pt-BR',{
            minimumFractionDigits:3,
            maximumFractionDigits:3
        }) + " ton";

    document.getElementById("resultado").style.display = "block";
}

</script>

</body>
</html>
